<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ==== AJUSTE RÁPIDO ==== */
:root{
  --accent:#D6EB1E;
  --node:rgba(17,18,12,.96);
  --line:rgba(170,172,150,.22);
  --line-strong:rgba(170,172,150,.4);
  --glass-stroke:rgba(170,172,150,.3);
  --ink:rgba(240,241,232,.94);
  --ink-dim:rgba(184,186,164,.85);
  --ink-faint:rgba(164,166,142,.6);
}
html,body{margin:0;padding:0;background:#0F1009}
#stage{width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage svg{display:block;width:100%;height:auto}
.track{fill:none;stroke:var(--line-strong);stroke-width:1.5;stroke-linecap:round}
.pod{fill:none;stroke:var(--glass-stroke);stroke-width:1}
.podLit{fill:none;stroke:var(--accent);stroke-width:1.2}
.nodeBg{fill:var(--node);stroke:var(--glass-stroke);stroke-width:1}
.subBg{fill:var(--node);stroke:rgba(170,172,150,.26);stroke-width:1}
.ic{color:var(--ink-dim)}
.icSub{color:var(--ink-faint)}
.ic-lit{color:var(--accent)}
.ring{fill:none;stroke:var(--accent);stroke-width:1.5}
.ringSub{fill:none;stroke:var(--accent);stroke-width:1.2}
.halo{fill:none;stroke:var(--accent)}
.dot{fill:var(--accent)}
.dotHalo{fill:var(--accent);opacity:.22}
.learn{fill:none;stroke:var(--accent);opacity:.32;stroke-width:1.1;stroke-dasharray:2 6}
.fp{fill:var(--accent)}
.lbl{fill:var(--ink)}
.sublbl{fill:var(--ink-dim)}
.phase{fill:var(--ink-faint);letter-spacing:.22em}
.flbl{fill:var(--accent);opacity:.7;font-size:11.5px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
(function(){
var D=15;
var ICON={
cursor:'<path d="M6.5 4.5l5.2 13.4 1.9-5.5 5.5-2.1z"/><path d="M13.6 12.4l4.9 4.9"/>',
orb:'<circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M4.2 9.6a7.6 7.6 0 0 0 0 4.8"/><path d="M19.8 9.6a7.6 7.6 0 0 1 0 4.8"/>',
filter:'<path d="M4.2 5.2h15.6l-6.2 7.4V19l-3.2-2.3v-4.1z"/>',
profile:'<circle cx="8.5" cy="8" r="2.7"/><path d="M3.8 18.2c0-2.7 2.1-4.4 4.7-4.4s4.7 1.7 4.7 4.4"/><path d="M16.2 7.2h4.3"/><path d="M16.2 10.7h4.3"/><path d="M16.2 14.2h4.3"/>',
calendar:'<rect x="3.8" y="5" width="16.4" height="15" rx="2"/><path d="M3.8 9.6h16.4"/><path d="M8.2 3.2v3M15.8 3.2v3"/><rect x="6.6" y="12.2" width="2.9" height="2.4" rx=".6"/><rect x="10.6" y="12.2" width="2.9" height="2.4" rx=".6"/><rect x="14.6" y="12.2" width="2.9" height="2.4" rx=".6" fill="currentColor"/>',
msg:'<rect x="2.8" y="4.6" width="11.6" height="8.6" rx="1.6"/><path d="M2.8 6.2l5.8 4.2 5.8-4.2"/><path d="M21.4 16.4a4.4 4.4 0 0 1-6.4 3.9l-2.4.8.8-2.3a4.4 4.4 0 1 1 8-2.4z"/>',
recover:'<path d="M4.6 12a7.4 7.4 0 1 0 2.7-5.7"/><path d="M4.3 4.8v3.9h3.9"/>',
meet:'<circle cx="7.8" cy="9.3" r="2.5"/><path d="M3.4 18.4c0-2.5 2-4.1 4.4-4.1s4.4 1.6 4.4 4.1"/><circle cx="16.2" cy="9.3" r="2.5"/><path d="M11.8 18.4c0-2.5 2-4.1 4.4-4.1s4.4 1.6 4.4 4.1"/>',
gauge:'<path d="M4.5 16.5a7.5 7.5 0 1 1 15 0"/><path d="M12 16.5l3.4-3.9"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor" stroke="none"/>',
send:'<path d="M3.8 11.6l16.7-7.2-4.4 15.4-4.1-6.1z"/><path d="M20.5 4.4l-8.5 9.3"/>',
doc:'<rect x="5" y="3.6" width="14" height="16.8" rx="2"/><path d="M8.4 8.2h7.2M8.4 11.8h7.2M8.4 15.4h4.2"/>',
dash:'<rect x="3.8" y="4.2" width="16.4" height="15.6" rx="2"/><path d="M8.2 16v-3.6M12 16v-6M15.8 16v-8.4"/>'
};
var LEAD={label:'Visita',icon:'cursor'};
var PODS=[
 {phase:'Antes',label:'Conversa',icon:'orb',subs:[{label:'Filtro',icon:'filter'},{label:'Qualificação',icon:'profile'}]},
 {phase:'Entre',label:'Agendamento',icon:'calendar',subs:[{label:'Confirmação',icon:'msg'},{label:'Recuperação',icon:'recover'}]},
 {phase:'Durante',label:'Reunião',icon:'meet',big:true,subs:[{label:'Assistente',icon:'orb'},{label:'Connection Score',icon:'gauge',lines:['Connection','Score']}]},
 {phase:'Depois',label:'Follow-up',icon:'send',subs:[{label:'Resumo',icon:'doc'},{label:'Insights',icon:'dash'}]}
];
function icon(n,x,y,s,cls){return '<g class="'+cls+'" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate('+(x-12*s)+' '+(y-12*s)+') scale('+s+')">'+ICON[n]+'</g>'}
function clamp(v){return Math.min(Math.max(v,0.002),0.996)}
function txt(x,y,lines,cls,size,anchor,dy){
 var h='<text x="'+x+'" y="'+y+'" class="'+cls+'" style="font-size:'+size+'px" text-anchor="'+(anchor||'middle')+'">';
 lines.forEach(function(l,i){h+='<tspan x="'+x+'" dy="'+(i?(dy||size+1):0)+'">'+l+'</tspan>'});
 return h+'</text>';
}
/* ---------- geometrias ---------- */
function geoH(){
 var Y=170,A=-70,B=1150,g={w:1080,h:364,mobile:false,axis:'h',Y:Y};
 g.dotPath='M '+A+' '+Y+' L '+B+' '+Y;
 var t=function(x){return (x-A)/(B-A)};
 g.lead={x:84,y:Y,r:15,label:LEAD.label,icon:LEAD.icon,t:t(84),labelAt:[84,224]};
 var cxs=[250,466,682,898];
 g.pods=PODS.map(function(p,i){
  var cx=cxs[i];
  return {p:p,cx:cx,cy:Y,hw:96,hh:32,r:p.big?36:34,t:t(cx),
   phaseAt:[cx,80],labelAt:[cx,108],
   subs:p.subs.map(function(s,j){
    var sx=cx+(j?62:-62);
    return {s:s,x:sx,y:Y,r:15,t:t(sx),labelAt:[sx,224]};
   })};
 });
 g.segs=[[0,154],[346,370],[562,586],[778,802],[994,1080]];
 g.learn='M 998 188 C 1046 208, 1048 290, 950 298 C 700 308, 420 308, 250 300 C 190 296, 150 274, 146 212';
 g.always=[540,330];
 return g;
}
function geoV(){
 var X=170,A=-40,B=680,g={w:340,h:640,mobile:true,axis:'v',Y:X};
 g.dotPath='M '+X+' '+A+' L '+X+' '+B;
 var t=function(y){return (y-A)/(B-A)};
 g.lead={x:X,y:58,r:13,label:LEAD.label,icon:LEAD.icon,t:t(58),labelAt:[192,62],anchor:'start'};
 var cys=[140,264,388,512];
 g.pods=PODS.map(function(p,i){
  var cy=cys[i];
  return {p:p,cx:X,cy:cy,hw:96,hh:30,r:p.big?32:30,t:t(cy),vertical:true,
   phaseAt:[X,cy-58],labelAt:[X,cy-42],
   subs:p.subs.map(function(s,j){
    var sx=X+(j?62:-62);
    return {s:s,x:sx,y:cy,r:13,t:t(cy),labelAt:[sx,cy+48]};
   })};
 });
 g.segs=[[0,110],[170,234],[294,358],[418,482],[542,640]];
 g.learn='M 262 528 C 312 522, 316 420, 314 300 C 312 200, 302 152, 264 138';
 g.always=[170,596];
 return g;
}
/* ---------- estrutura ---------- */
function pod(P,g){
 var h='<rect x="'+(P.cx-P.hw)+'" y="'+(P.cy-P.hh)+'" width="'+(P.hw*2)+'" height="'+(P.hh*2)+'" rx="'+P.hh+'" class="pod"/>';
 P.subs.forEach(function(S){
  h+='<circle cx="'+S.x+'" cy="'+S.y+'" r="'+S.r+'" class="subBg"/>'+icon(S.s.icon,S.x,S.y,S.r/24*1.2,'icSub');
 });
 if(P.p.big) h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+(P.r+7)+'" class="halo" stroke-width="5" opacity=".1"/>';
 h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+P.r+'" class="nodeBg"/>'+icon(P.p.icon,P.cx,P.cy,P.r/24*0.9,'ic');
 return h;
}
function skeleton(g){
 var h='<defs><marker id="arr" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l5 3-5 3" fill="none" style="stroke:var(--accent)" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
 g.segs.forEach(function(s){
  h+=g.mobile?'<line x1="'+g.Y+'" y1="'+s[0]+'" x2="'+g.Y+'" y2="'+s[1]+'" class="track"/>'
             :'<line x1="'+s[0]+'" y1="'+g.Y+'" x2="'+s[1]+'" y2="'+g.Y+'" class="track"/>';
 });
 h+='<path d="'+g.learn+'" class="learn" marker-end="url(#arr)"/>';
 for(var i=0;i<3;i++){
  h+='<circle r="2" class="fp" opacity="0"><animateMotion dur="9s" begin="-'+(i*3)+'s" repeatCount="indefinite" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".35 0 .65 1" path="'+g.learn+'"/><animate attributeName="opacity" values="0;.7;.7;0" keyTimes="0;0.12;0.85;1" dur="9s" begin="-'+(i*3)+'s" repeatCount="indefinite"/></circle>';
 }
 h+='<g id="dotLayer"></g>';
 var L=g.lead;
 h+='<circle cx="'+L.x+'" cy="'+L.y+'" r="'+L.r+'" class="subBg"/>'+icon(L.icon,L.x,L.y,L.r/24*1.2,'icSub');
 g.pods.forEach(function(P){h+=pod(P,g)});
 h+='<g id="litLayer"></g>';
 var sz=g.mobile?9.5:10.5;
 h+=txt(L.labelAt[0],L.labelAt[1],[L.label],'sublbl',sz,L.anchor);
 g.pods.forEach(function(P){
  h+=txt(P.phaseAt[0],P.phaseAt[1],[P.p.phase.toUpperCase()],'phase',g.mobile?9:10);
  h+=txt(P.labelAt[0],P.labelAt[1],[P.p.label],'lbl',g.mobile?13:15);
  P.subs.forEach(function(S){
   h+=txt(S.labelAt[0],S.labelAt[1],S.s.lines?S.s.lines:[S.s.label],'sublbl',sz,'middle',sz+1);
  });
 });
 h+=txt(g.always[0],g.always[1],['SEMPRE'],'phase',g.mobile?9:10);
 h+=txt(g.always[0],g.always[1]+18,['aprende e melhora'],'flbl',11.5);
 return '<svg viewBox="0 0 '+g.w+' '+g.h+'" role="img" aria-label="Como o Calead conduz o lead: da visita à conversa, ao agendamento, à reunião e ao follow-up, com o sistema aprendendo a cada ciclo">'+h+'</svg>';
}
/* ---------- animação ---------- */
function pulse(t0,t1,fade,ph){
 var a=clamp(t0-0.022),b=clamp(a+0.028),c=clamp(Math.max(t1,b+0.02)),d=clamp(c+(fade||0.07));
 var t=[a,b,c,d];for(var i=1;i<4;i++) if(t[i]<=t[i-1]) t[i]=t[i-1]+0.002;
 return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;'+t.map(function(v){return v.toFixed(4)}).join(';')+';1" calcMode="spline" keySplines="0 0 1 1;.18 0 .2 1;0 0 1 1;.5 0 .75 1;0 0 1 1" dur="'+D+'s"'+(ph?' begin="-'+ph.toFixed(2)+'s"':'')+' repeatCount="indefinite"/>';
}
function litLayer(g,ph){
 var h='',L=g.lead;
 h+='<g opacity="0"><circle cx="'+L.x+'" cy="'+L.y+'" r="'+L.r+'" fill="var(--node)"/><circle cx="'+L.x+'" cy="'+L.y+'" r="'+L.r+'" class="ringSub"/>'
  +icon(L.icon,L.x,L.y,L.r/24*1.2,'ic-lit')+pulse(L.t,L.t+0.01,0,ph)+'</g>';
 g.pods.forEach(function(P){
  var t0=P.subs[0].t,t1=P.subs[1].t;
  h+='<g opacity="0"><rect x="'+(P.cx-P.hw)+'" y="'+(P.cy-P.hh)+'" width="'+(P.hw*2)+'" height="'+(P.hh*2)+'" rx="'+P.hh+'" class="podLit" opacity=".55"/>'+pulse(t0,t1+0.012,0.1,ph)+'</g>';
  P.subs.forEach(function(S){
   h+='<g opacity="0"><circle cx="'+S.x+'" cy="'+S.y+'" r="'+S.r+'" fill="var(--node)"/><circle cx="'+S.x+'" cy="'+S.y+'" r="'+S.r+'" class="ringSub"/>'
    +icon(S.s.icon,S.x,S.y,S.r/24*1.2,'ic-lit')+pulse(S.t,S.t+0.012,0,ph)+'</g>';
  });
  h+='<g opacity="0">';
  h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+(P.r+5)+'" class="halo" stroke-width="4" opacity=".14"/>';
  h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+(P.r+11)+'" class="halo" stroke-width="7" opacity=".06"/>';
  h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+P.r+'" fill="var(--node)"/>';
  h+='<circle cx="'+P.cx+'" cy="'+P.cy+'" r="'+P.r+'" class="ring"/>';
  h+=icon(P.p.icon,P.cx,P.cy,P.r/24*0.9,'ic-lit');
  if(P.p.big) h+='<circle cx="'+(P.cx-13)+'" cy="'+(P.cy+P.r+11)+'" r="3" class="dot"/><circle cx="'+(P.cx+13)+'" cy="'+(P.cy+P.r+11)+'" r="3" class="dot"/>';
  h+=pulse(P.t,P.t+(P.p.big?0.05:0.03),0.09,ph)+'</g>';
 });
 return h;
}
function dotLayer(g,ph){
 var stops=[{t:g.lead.t,d:0.008}];
 g.pods.forEach(function(P){
  stops.push({t:P.subs[0].t,d:0.006},{t:P.t,d:P.p.big?0.024:0.016},{t:P.subs[1].t,d:0.006});
 });
 var kp=['0'],kt=['0'],ks=[],last=0;
 stops.forEach(function(s){
  var a=clamp(s.t-s.d),b=clamp(s.t+s.d);
  if(a<=last) return;
  kp.push(s.t.toFixed(4),s.t.toFixed(4)); kt.push(a.toFixed(4),b.toFixed(4));
  ks.push('.42 0 .18 1','0 0 1 1'); last=b;
 });
 kp.push('1'); kt.push('1'); ks.push('.45 0 .55 1');
 var motion='<animateMotion dur="'+D+'s"@ repeatCount="indefinite" calcMode="spline" keyPoints="'+kp.join(';')+'" keyTimes="'+kt.join(';')+'" keySplines="'+ks.join(';')+'" path="'+g.dotPath+'"/>';
 var h='';
 [[0.10,2.6,.28],[0.20,1.9,.16]].forEach(function(t){
  var b=' begin="-'+(((ph||0)+D-t[0])%D).toFixed(2)+'s"';
  h+='<g opacity="0"><circle r="'+t[1]+'" class="dot" opacity="'+t[2]+'"/>'
   +'<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="'+D+'s"'+b+' repeatCount="indefinite"/>'
   +motion.replace('@',b)+'</g>';
 });
 var mb=ph?' begin="-'+ph.toFixed(2)+'s"':'';
 h+='<g opacity="0"><circle r="9" class="dotHalo"/><circle r="4.6" class="dot"/>'
  +'<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.035;0.94;1" dur="'+D+'s"'+mb+' repeatCount="indefinite"/>'
  +motion.replace('@',mb)+'</g>';
 return h;
}
var stage=document.getElementById('stage');
var mqM=matchMedia('(max-width:760px)');
var rm=matchMedia('(prefers-reduced-motion: reduce)');
var meetT=0.62;
function applyRM(){
 var s=stage.querySelector('svg');
 if(!s||!s.pauseAnimations) return;
 if(rm.matches){ s.pauseAnimations(); try{s.setCurrentTime(meetT*D);}catch(e){} }
 else s.unpauseAnimations();
}
var curV=null;
function render(){
 curV=mqM.matches;
 var g=curV?geoV():geoH();
 stage.innerHTML=skeleton(g);
 meetT=g.pods[2].t;
 var phases=[0,D/3,2*D/3],dl='',ll='';
 phases.forEach(function(ph){ dl+=dotLayer(g,ph); ll+=litLayer(g,ph); });
 document.getElementById('dotLayer').innerHTML=dl;
 document.getElementById('litLayer').innerHTML=ll;
 applyRM();
}
var rt;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(mqM.matches!==curV) render()},120)});
if(mqM.addEventListener) mqM.addEventListener('change',function(){if(mqM.matches!==curV) render()});
rm.addEventListener('change',applyRM);
render();
})();
</script>
</body>
</html>
